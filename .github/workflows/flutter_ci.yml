name: Flutter CI

on:
  push:
    branches: [ master, flutter, main ]
  pull_request:
    branches: [ master, flutter, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  version:
    name: Resolve Next Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      build_number: ${{ steps.next.outputs.build_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute next patch version
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="${major}.${minor}.$((patch + 1))"
          else
            version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: [analyze, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Minified Release APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=build/symbols --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Build Minified Universal APK (all ABIs)
        run: flutter build apk --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: questopia-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-windows:
    name: Build Windows x64
    needs: [analyze, version]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Minified Windows Release
        run: flutter build windows --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Questopia-Windows-x64.zip" -Force

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: questopia-windows-x64
          path: Questopia-Windows-x64.zip
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [version, build-android, build-windows]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: questopia-android-apks
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: questopia-windows-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Questopia-RE v${{ needs.version.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            release-assets/*.apk
            release-assets/Questopia-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
