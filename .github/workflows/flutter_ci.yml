name: Flutter CI

on:
  push:
    branches: [ master, flutter, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, flutter, main ]

permissions:
  contents: write

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  build-android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Minified Release APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=build/symbols

      - name: Build Minified Universal APK (all ABIs)
        run: flutter build apk --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: questopia-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-windows:
    name: Build Windows x64
    needs: analyze
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Minified Windows Release
        run: flutter build windows --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Questopia-Windows-x64.zip" -Force

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: questopia-windows-x64
          path: Questopia-Windows-x64.zip
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: questopia-android-apks
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: questopia-windows-x64
          path: release-assets

      - name: Prepare Release Tag & Metadata
        id: release_info
        run: |
          echo "tag_name=v1.0.0" >> $GITHUB_OUTPUT
          echo "release_name=Questopia-RE v1.0.0" >> $GITHUB_OUTPUT

      - name: Remove Old Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName -q '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "v1.0.0" ]; then
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Create or Overwrite GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            release-assets/*.apk
            release-assets/Questopia-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
